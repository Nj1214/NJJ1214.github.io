<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;}
    a-scene {width: 100%; height: 100%;}
  </style>
</head>

<body>
<a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <!-- โมเดลแว่น -->
    <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
    
    <!-- โมเดล Occluder (ล่องหนสำหรับบังส่วนหลัง)[cite: 1] -->
    <a-asset-item id="headModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
    
    <!-- 1. เปลี่ยน URL ตรงนี้เป็นไฟล์โมเดลหมวกของคุณ (.gltf หรือ .glb) -->
    <a-asset-item id="hatModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/hat/scene.gltf"></a-asset-item>
  </a-assets>

  <!-- Anchor สำหรับ Head Occluder (ล่องหนเพื่อบังหมวกด้านหลัง)[cite: 1] -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model 
      mindar-face-occluder 
      position="0 -0.3 0.15" 
      rotation="0 0 0" 
      scale="0.065 0.065 0.065" 
      src="#headModel">
    </a-gltf-model>
  </a-entity>

  <!-- Anchor สำหรับแว่นตา (จุด 168: ดั้งจมูก/ระหว่างตา) -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model 
      rotation="0 0 0" 
      position="0 0 0" 
      scale="0.008 0.008 0.008" 
      src="#glassesModel">
    </a-gltf-model>
  </a-entity>

  <!-- 2. Anchor สำหรับหมวก (จุด 10: บริเวณหน้าผาก/ขอบผมด้านบน) -->
  <a-entity mindar-face-target="anchorIndex: 10">
    <a-gltf-model 
      position="0 0.5 0" 
      rotation="0 0 0" 
      scale="0.3 0.3 0.3" 
      src="#hatModel">
    </a-gltf-model>
  </a-entity>

  <a-camera active="false" position="0 0 0"></a-camera>

</a-scene>
</body>
</html>
