<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;}
    a-scene {width: 100%; height: 100%;}
  </style>
</head>

<body>
<a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
    <a-asset-item id="headModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
    <a-asset-item id="hatModel" src="896eb0323e54480db6d702e48faa0689.glb"></a-asset-item>
  </a-assets>

  <!-- Head Occluder (โมเดลบังล่องหน) -->
  <a-entity mindar-face-target="anchorIndex: 168">
    <a-gltf-model 
      mindar-face-occluder 
      position="0 -0.3 0.15" 
      rotation="0 0 0" 
      scale="0.065 0.065 0.065" 
      src="#headModel">
    </a-gltf-model>
  </a-entity>

  <!-- แว่นตา (เปลี่ยน Anchor ไปที่สันจมูก Index 1 และปรับขนาดให้เห็นชัด) -->
  <a-entity mindar-face-target="anchorIndex: 1">
    <a-gltf-model 
      rotation="0 0 0" 
      position="0 0.05 0.05" 
      scale="0.06 0.06 0.06" 
      src="#glassesModel">
    </a-gltf-model>
  </a-entity>

  <!-- หมวก (ดัดแกน rotation="0 0 90" แก้ปัญหาหมวกตะแคง และขยายสวมหัว) -->
  <a-entity mindar-face-target="anchorIndex: 10">
    <a-entity position="0 -0.05 -0.1">
      <a-gltf-model 
        rotation="0 0 90" 
        scale="1.5 1.5 1.5" 
        src="#hatModel">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <a-camera active="false" position="0 0 0"></a-camera>

</a-scene>
</body>
</html>
