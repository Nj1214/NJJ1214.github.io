<!DOCTYPE html>
<html>
<head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden;}
    a-scene {width: 100%;  height: 100%;}
  </style>
</head>

<body>
<a-scene mindar-face embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <a-asset-item id="glassesModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/glasses/scene.gltf"></a-asset-item>
    <a-asset-item id="headModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/face-tracking/assets/sparkar/headOccluder.glb"></a-asset-item>
    <!-- 1. โหลดโมเดลหมวก -->
    <a-asset-item id="hatModel" src="896eb0323e54480db6d702e48faa0689.glb"></a-asset-item>
  </a-assets>

  <!-- Anchor แว่นตา/กล่องแดง (ของอาจารย์) -->
  <a-entity mindar-face-target="anchorIndex: 1">
    <a-box position="0 0 0" scale="0.1 0.1 0.1" color="red"></a-box>
  </a-entity>

  <!-- 2. เพิ่มหมวก (ผูกไว้กับจุด 10 บนหน้าผาก + ซ้อน Entity แก้แกนเอียง) -->
  <a-entity mindar-face-target="anchorIndex: 10">
    <a-entity position="0 0.1 -0.05">
      <a-gltf-model 
        rotation="0 0 90" 
        scale="1.2 1.2 1.2" 
        src="#hatModel">
      </a-gltf-model>
    </a-entity>
  </a-entity>

  <a-camera active="false" position="0 0 0"> </a-camera>

</a-scene>
</body>
</html>
